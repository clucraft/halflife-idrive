# The ALSA name the tests on the PC use for sound (tools/run/service.sh).
#
# "car" stands in for the head unit's "plug:smartx:CarLifeMedia_CF_48_STEREO":
# a PulseAudio null sink at 48 kHz (it has a clock and no speakers), whose
# monitor the test records. The engine opens it at 48 kHz, as it does in the
# car, and converts its own 44.1 kHz sound itself.
#
# It does not imitate SmartXbar's buffer rule (three periods of 1024 frames).

pcm.car {
    type pulse
    device car
}
